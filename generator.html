<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALINV-3D — Offline Map Baker</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --accent: #00f0ff;
      --text: #e2e8f0;
      --muted: #64748b;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: var(--accent);
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    p.subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: var(--muted);
    }

    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      width: 120px;
      outline: none;
    }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      box-shadow: 0 0 15px var(--accent);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .progress-section {
      margin-bottom: 1.5rem;
    }

    progress {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      appearance: none;
    }

    progress::-webkit-progress-bar {
      background: var(--bg);
    }

    progress::-webkit-progress-value {
      background: var(--accent);
    }

    .status-text {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      height: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #a0aec0;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 1rem;
      border-radius: 6px;
      resize: vertical;
      margin-bottom: 1.5rem;
      outline: none;
    }

    .stats-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
    }

    .stats-panel h3 {
      color: var(--accent);
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .stats-panel ul {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Map Baker Tool</h1>
    <p class="subtitle">Curated Procedural City Pre-Baking Pipeline (Layers 0 – 6)</p>

    <div class="controls">
      <label for="preset-select">Preset:</label>
      <select id="preset-select" style="background:var(--bg); border:1px solid var(--border); color:var(--accent); padding:0.75rem 1rem; border-radius:6px; font-size:0.95rem; outline:none;">
        <option value="retro_arcade" selected>Retro Arcade City (alinv2city.jpg)</option>
        <option value="metropolitan_ny">Metropolitan NY (NYC-ISONMETRIC.jpg)</option>
      </select>
      <label for="seed-input">Seed:</label>
      <input type="number" id="seed-input" value="42" min="1" max="999999" />
      <button id="btn-bake">Bake Map</button>
      <button id="btn-download" class="secondary" disabled>Download JSON</button>
    </div>

    <div class="progress-section">
      <progress id="progress-bar" value="0" max="100"></progress>
      <div id="status-text" class="status-text">Ready to bake map.</div>
    </div>

    <textarea id="log-terminal" readonly placeholder="Generation logs will appear here..."></textarea>

    <div id="stats-panel" class="stats-panel">
      <h3>Bake Stats</h3>
      <p style="font-size:0.85rem; color:var(--muted)">No map generated yet.</p>
    </div>
  </div>

  <script type="module" src="/src/generation/generator-ui.ts"></script>
</body>
</html>
