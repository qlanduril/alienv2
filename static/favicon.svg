<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Cockpit Dome Gradient -->
    <linearGradient id="cockpitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Cockpit Specular -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Saucer Upper Hull Gradient -->
    <linearGradient id="hullUpper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Saucer Rim Gradient -->
    <linearGradient id="hullRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Under-Saucer Reactor Glow -->
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>

    <!-- Abduction / Death Ray Beam -->
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Ring Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Center Glow -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Badge Base with Neon Cyber Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGlow)" stroke="#0ea5e9" stroke-width="8" stroke-opacity="0.8" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Abduction Tractor / Death Ray Cone (pointing downward) -->
  <polygon points="216,330 296,330 380,470 132,470" fill="url(#beamGrad)" />

  <!-- Beam Scanning Particle Lines -->
  <line x1="170" y1="410" x2="342" y2="410" stroke="#67e8f9" stroke-width="4" stroke-opacity="0.5" stroke-dasharray="12 8" />
  <line x1="190" y1="440" x2="322" y2="440" stroke="#a5f3fc" stroke-width="3" stroke-opacity="0.7" stroke-dasharray="8 6" />

  <!-- Under-Saucer Reactor Core (glowing cyan orb) -->
  <ellipse cx="256" cy="326" rx="64" ry="24" fill="#0891b2" />
  <ellipse cx="256" cy="328" rx="42" ry="16" fill="#22d3ee" filter="url(#neonGlow)" />
  <ellipse cx="256" cy="329" rx="22" ry="8" fill="#ffffff" />

  <!-- Cockpit Glass Dome -->
  <ellipse cx="256" cy="216" rx="92" ry="80" fill="url(#cockpitGrad)" filter="url(#neonGlow)" />
  <!-- Alien Pilot Eyes Inside Cockpit -->
  <ellipse cx="236" cy="212" rx="10" ry="16" fill="#022c22" transform="rotate(-15 236 212)" />
  <ellipse cx="276" cy="212" rx="10" ry="16" fill="#022c22" transform="rotate(15 276 212)" />
  <circle cx="234" cy="208" r="3" fill="#34d399" />
  <circle cx="274" cy="208" r="3" fill="#34d399" />

  <!-- Cockpit Specular Reflection Arc -->
  <path d="M 188 190 A 74 62 0 0 1 296 160 A 70 54 0 0 0 204 186 Z" fill="url(#specularGrad)" />

  <!-- Main Saucer Hull (Lower Flange) -->
  <ellipse cx="256" cy="296" rx="188" ry="52" fill="#090d16" stroke="#0284c7" stroke-width="4" />

  <!-- Main Saucer Hull (Upper Metallic Bevel) -->
  <ellipse cx="256" cy="278" rx="180" ry="46" fill="url(#hullUpper)" />
  <ellipse cx="256" cy="274" rx="172" ry="38" fill="url(#hullRim)" />

  <!-- Glowing Perimeter Thruster Nodes / Signal Lights -->
  <!-- Left to Right along the lower rim curve -->
  <!-- 1. Far Left -->
  <ellipse cx="98" cy="286" rx="10" ry="6" fill="#f43f5e" filter="url(#neonGlow)" />
  <ellipse cx="98" cy="286" rx="4" ry="2.5" fill="#fff" />

  <!-- 2. Mid Left -->
  <ellipse cx="150" cy="304" rx="12" ry="7" fill="#fbbf24" filter="url(#neonGlow)" />
  <ellipse cx="150" cy="304" rx="5" ry="3" fill="#fff" />

  <!-- 3. Center Left -->
  <ellipse cx="212" cy="316" rx="14" ry="8" fill="#22c55e" filter="url(#neonGlow)" />
  <ellipse cx="212" cy="316" rx="6" ry="3.5" fill="#fff" />

  <!-- 4. Center Right -->
  <ellipse cx="300" cy="316" rx="14" ry="8" fill="#06b6d4" filter="url(#neonGlow)" />
  <ellipse cx="300" cy="316" rx="6" ry="3.5" fill="#fff" />

  <!-- 5. Mid Right -->
  <ellipse cx="362" cy="304" rx="12" ry="7" fill="#a855f7" filter="url(#neonGlow)" />
  <ellipse cx="362" cy="304" rx="5" ry="3" fill="#fff" />

  <!-- 6. Far Right -->
  <ellipse cx="414" cy="286" rx="10" ry="6" fill="#f43f5e" filter="url(#neonGlow)" />
  <ellipse cx="414" cy="286" rx="4" ry="2.5" fill="#fff" />

  <!-- Central Energy Ring Accent on Hull -->
  <ellipse cx="256" cy="268" rx="112" ry="22" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.85" />

  <!-- Top Fin / Antenna Spike with Pulsing Beacon -->
  <path d="M 254 136 L 258 136 L 257 96 L 255 96 Z" fill="#38bdf8" />
  <circle cx="256" cy="94" r="10" fill="#f43f5e" filter="url(#intenseGlow)" />
  <circle cx="256" cy="94" r="5" fill="#ffffff" />
</svg>
